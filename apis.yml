aid: dataxu
name: Dataxu
description: >-
  DataXu was a Boston-based programmatic advertising technology company, founded
  in 2009, that built a cloud-based demand-side platform (DSP) for automated,
  data-driven media buying across display, video, mobile, and connected TV. The
  company was acquired by Roku in 2019 and its technology was absorbed into
  Roku's OneView advertising platform (now Roku Ads). DataXu no longer operates
  as an independent brand: its primary domain (dataxu.com) 301-redirects into
  Roku's advertising site, and there is no independent DataXu developer portal,
  public API, SDK, or documentation surface. This profile is retained in the API
  Evangelist network as a historical / acquired-company record surfaced from the
  Menlo Ventures portfolio.
